<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Play Hangman! Guess words, earn points and challenge yourself."
    />
    <title>Hangman Game</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Hangman</h1>
      <p class="subtitle">
        Guess the hidden word before you run out of attempts!
      </p>

      <section class="game-info">
        <div class="info-box">Score: <span id="score">0</span></div>
        <div class="info-box">Mistakes: <span id="mistakes">0</span> / 6</div>
      </section>

      <section class="game-card">
        <div class="category">Category: <span id="category">General</span></div>

        <div class="image">
          <img src="./images/hangman0.png" alt="Hangman illustration" />
        </div>

        <div class="clue">
          <p id="word-display">_ _ _ _ _</p>
        </div>

        <p class="message" id="message" aria-live="polite"></p>

        <div class="letters" id="letters"></div>

        <div class="controls">
          <button id="hint-btn" class="hint-btn">Hint (-5 points)</button>
          <button id="restart-btn">New Game</button>
        </div>
      </section>

      <footer>Use your keyboard or click the letters to play.</footer>
    </main>
  </body>
</html>
