<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Play Hangman, guess the hidden word and test your vocabulary."
    />
    <meta name="theme-color" content="#e9ecef" />

    <title>Hangman Game</title>

    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>

  <body>
    <main class="game-container">
      <header class="game-header">
        <h1>Hangman</h1>
        <p>Guess the hidden word before you run out of attempts!</p>
      </header>

      <section class="game-content" aria-label="Hangman game">
        <div class="letters" aria-label="Choose a letter"></div>

        <div class="image">
          <img
            src="./images/hangman0.png"
            alt="Hangman with no incorrect guesses"
          />
        </div>

        <div class="clue">
          <p aria-label="Hidden word" aria-live="polite">_ _ _ _ _</p>
        </div>

        <p class="attempts" aria-live="polite">Mistakes: <span>0</span> / 6</p>

        <div class="gameover" aria-live="polite" role="status">
          <p></p>
        </div>

        <button class="restart-btn" type="button">New Game</button>
      </section>

      <footer>
        <p>Made with ❤️ using HTML, CSS and JavaScript</p>
      </footer>
    </main>
  </body>
</html>
